name: Sync VMAware header

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      tag: ${{ steps.vmaware.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest VMAware release tag
        id: vmaware
        run: |
          set -euo pipefail
          tag=$(curl -fsS https://api.github.com/repos/NotRequiem/VMAware/releases/latest -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            | jq -r .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Get latest VMAware main SHA
        id: sha
        run: |
          set -euo pipefail
          sha=$(curl -fsS https://api.github.com/repos/NotRequiem/VMAware/commits/main -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            | jq -r .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Update vendored header
        run: |
          curl -fsSL -o deps/vmaware.hpp \
            https://raw.githubusercontent.com/NotRequiem/VMAware/main/src/vmaware.hpp

      - name: Check if header changed
        id: changed
        run: |
          git diff --quiet deps/vmaware.hpp \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload updated header
        if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vmaware-header
          path: deps/vmaware.hpp

  test:
    needs: update
    if: needs.update.outputs.changed == 'true'

    strategy:
      fail-fast: false
      matrix:
        os:
          # Linux x86_64
          - ubuntu-24.04

          # Linux ARM64
          - ubuntu-24.04-arm

          # macOS x86_64
          - macos-26-intel

          # macOS ARM64
          - macos-26

          # Windows x86_64
          - windows-2025

          # Windows ARM64
          - windows-11-arm

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Download updated header
        uses: actions/download-artifact@v8
        with:
          name: vmaware-header
          path: deps

      - name: Run basic example
        run: cargo run --example basic

  push:
    needs:
      - update
      - test

    if: |
      always() &&
      needs.update.outputs.changed == 'true' &&
      needs.test.result == 'success'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download updated header
        uses: actions/download-artifact@v8
        with:
          name: vmaware-header
          path: deps

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push to master
        run: |
          git add deps/vmaware.hpp
          git commit -m "chore: sync VMAware main (${{ needs.update.outputs.sha }})"
          git push
